services:
  - type: web
    name: veribounty-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false   # Set in Render dashboard
      - key: GEMINI_API_KEY
        sync: false   # Set in Render dashboard
      - key: CORS_ORIGIN
        sync: false   # Set to your Vercel frontend URL
